# Grafana k6 load-testing stack for Stitch & Style.
#
#   docker compose up -d                     # InfluxDB + Grafana only
#   open http://localhost:3000               # dashboard: Stitch & Style — k6 load test
#   docker compose run --rm k6 run --out influxdb=http://localhost:8086/k6 /scripts/catalog.js
#   docker compose down                      # stop (add -v to wipe metrics)
#
# k6 uses host networking on Linux so it can reach the Spring backend on
# 127.0.0.1:38133 (Docker's bridge cannot reach host-local ports when UFW is on).
# On macOS/Windows use a locally installed k6 instead and keep BASE_URL as the
# backend URL.
name: stitchstyle-loadtest

services:
  influxdb:
    image: influxdb:1.8
    container_name: stitchstyle-k6-influx
    environment:
      INFLUXDB_DB: k6
    ports:
      - "8086:8086"
    volumes:
      - k6-influx:/var/lib/influxdb
    healthcheck:
      test: ["CMD", "influx", "-execute", "SHOW DATABASES"]
      interval: 5s
      timeout: 3s
      retries: 20

  grafana:
    image: grafana/grafana:11.5.0
    container_name: stitchstyle-k6-grafana
    depends_on:
      influxdb:
        condition: service_healthy
    ports:
      - "3000:3000"
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: "Admin"
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_USERS_DEFAULT_THEME: "light"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro

  # Run on demand: docker compose run --rm k6 run --out ... /scripts/<file>.js
  k6:
    image: grafana/k6:latest
    profiles: ["run"]
    network_mode: host
    # Local-only convenience: the bind-mounted results/ folder is host-owned.
    user: "0:0"
    working_dir: /scripts
    volumes:
      - ./:/scripts:ro
      - ./results:/results
    environment:
      BASE_URL: ${BASE_URL:-http://localhost:38133}
      VUS_MAX: ${VUS_MAX:-}
      RAMP: ${RAMP:-}
      HOLD: ${HOLD:-}
      MODE: ${MODE:-}
      PAYMENT_METHOD: ${PAYMENT_METHOD:-}
      THINK_TIME: ${THINK_TIME:-}
      SPOOF_FORWARDED: ${SPOOF_FORWARDED:-}
      PAYMENT_PROVIDER: ${PAYMENT_PROVIDER:-}
      CALLBACK_SECRET: ${CALLBACK_SECRET:-}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
    command: ["run", "--out", "influxdb=http://localhost:8086/k6", "/scripts/catalog.js"]

volumes:
  k6-influx:
