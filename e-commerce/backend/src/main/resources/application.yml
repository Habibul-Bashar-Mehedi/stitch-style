server:
  port: ${SERVER_PORT:38133}
  forward-headers-strategy: framework
  servlet:
    session:
      cookie:
        http-only: true
        secure: ${SESSION_COOKIE_SECURE:false}
        same-site: lax
        # Do not use the generic name "SESSION": cookies are scoped by host, not
        # port, so every app on localhost would share (and corrupt) this cookie.
        name: STITCHSTYLE_SESSION

spring:
  config:
    # Load the gitignored local .env whether the app is started from the
    # repository root or from the backend directory (IntelliJ/Gradle).
    import:
      # Cover the usual launch directories: backend/, e-commerce/, the
      # repository root, and the parent IntelliJ workspace root.
      - optional:file:../.env[.properties]
      - optional:file:./.env[.properties]
      - optional:file:./e-commerce/.env[.properties]
      - optional:file:./Stitch&Style/e-commerce/.env[.properties]
  application:
    name: stitch-style
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/stitchstyle}
    username: ${DB_USERNAME:lemon}
    password: ${DB_PASSWORD:lemon}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        format_sql: false
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
  session:
    store-type: jdbc
    jdbc:
      initialize-schema: never
      table-name: SPRING_SESSION
  cache:
    type: ehcache
    ehcache:
      config: classpath:ehcache.xml
  security:
    oauth2:
      client:
        registration:
          google:
            # Never commit real Google credentials. Put them in .env (gitignored)
            # or in the process environment. The placeholders keep the app bootable
            # for contributors who do not need to sign in with Google.
            client-id: ${GOOGLE_CLIENT_ID:dev-client-id}
            client-secret: ${GOOGLE_CLIENT_SECRET:dev-client-secret}
            scope: openid,email,profile
        provider:
          google:
            issuer-uri: https://accounts.google.com

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,caches
  endpoint:
    health:
      show-details: when-authorized

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    # Keep the document readable: collapsed operations, tag grouping, a filter
    # box, request durations and authorization entered once per session.
    doc-expansion: none
    operations-sorter: alpha
    display-request-duration: true
    filter: true
    persist-authorization: true
    try-it-out-enabled: true
    default-model-expand-depth: 1

app:
  public-base-url: ${PUBLIC_BASE_URL:http://localhost:4000}
  openapi:
    # Absolute backend URL advertised in Swagger UI. Leave empty to derive it
    # from server.port; "/" (the current origin) always comes first.
    server-url: ${OPENAPI_SERVER_URL:}
  dev-tools:
    enabled: ${DEV_TOOLS_ENABLED:false}
  catalog:
    max-depth: 4
    home:
      latest-products: 8
  security:
    bootstrap-admin-emails: ${BOOTSTRAP_ADMIN_EMAILS:admin@example.com}
    staff-session-timeout: 30m
    customer-session-timeout: 8h
    allowed-redirect-hosts: ${ALLOWED_REDIRECT_HOSTS:localhost}
  media:
    storage: ${MEDIA_STORAGE:local}
    local-root: ${MEDIA_LOCAL_ROOT:./data/media}
    max-bytes: 10485760
    max-dimension: 6000
    public-base-url: ${MEDIA_PUBLIC_BASE_URL:/media}
  payments:
    callback-secret: ${PAYMENT_CALLBACK_SECRET:dev-callback-secret}
    callback-base-url: ${PAYMENT_CALLBACK_BASE_URL:http://localhost:38133}
    bkash:
      enabled: ${BKASH_ENABLED:false}
      base-url: ${BKASH_BASE_URL:https://tokenized.sandbox.bka.sh/v1.2.0-beta}
      app-key: ${BKASH_APP_KEY:}
      app-secret: ${BKASH_APP_SECRET:}
      username: ${BKASH_USERNAME:}
      password: ${BKASH_PASSWORD:}
    sslcommerz:
      enabled: ${SSLCOMMERZ_ENABLED:false}
      base-url: ${SSLCOMMERZ_BASE_URL:https://sandbox.sslcommerz.com}
      store-id: ${SSLCOMMERZ_STORE_ID:}
      store-password: ${SSLCOMMERZ_STORE_PASSWORD:}
  couriers:
    pathao:
      enabled: ${PATHAO_ENABLED:false}
      base-url: ${PATHAO_BASE_URL:https://api-hermes.pathao.com}
      token: ${PATHAO_TOKEN:}
    steadfast:
      enabled: ${STEADFAST_ENABLED:false}
      base-url: ${STEADFAST_BASE_URL:https://portal.packzy.com/api/v1}
      api-key: ${STEADFAST_API_KEY:}
      secret-key: ${STEADFAST_SECRET_KEY:}
    redx:
      enabled: ${REDX_ENABLED:false}
      base-url: ${REDX_BASE_URL:https://openapi.redx.com.bd/v1.0.0-beta}
      token: ${REDX_TOKEN:}
  notifications:
    sms:
      url: ${SMS_URL:}
      api-key: ${SMS_API_KEY:}
      sender: ${SMS_SENDER:StitchStyle}
    email:
      from: ${EMAIL_FROM:no-reply@stitchandstyle.bd}
  returns:
    window-days: ${RETURN_WINDOW_DAYS:7}
  rate-limit:
    enabled: ${RATE_LIMIT_ENABLED:true}
  idempotency:
    ttl: PT24H
  reservation:
    ttl: PT15M

logging:
  pattern:
    console: "%d{ISO8601} %-5level [%X{correlationId:-}] %logger{36} - %msg%n"
  level:
    com.stitchstyle: INFO
