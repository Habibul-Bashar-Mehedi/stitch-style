server:
  servlet:
    session:
      cookie:
        secure: false

spring:
  jpa:
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  flyway:
    clean-disabled: false

springdoc:
  swagger-ui:
    enabled: true

logging:
  level:
    com.stitchstyle: DEBUG
    org.hibernate.SQL: DEBUG
