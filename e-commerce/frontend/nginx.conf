# WebSocket upgrade handling for Angular/Vite HMR, hot reload and STOMP /ws.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    # Default server: any host that reaches this container (localhost,
    # 127.0.0.1, or an unmapped name) lands on Stitch & Style.
    listen 80 default_server;
    listen [::]:80 default_server;

    server_name stitchandstyle.com
                www.stitchandstyle.com
                stichandstyle.com
                stich-style.com
                stichstyle.com
                www.stichstyle.com
                stitchstyle.com
                www.stitchstyle.com
                stitchandstyle.local
                stitch-and-style.local
                stitchstyle.local
                localhost;

    # Product image / banner uploads go through the Angular proxy to Spring.
    client_max_body_size 25m;

    # OpenSearch descriptor so Firefox/Chrome can add the shop as a search
    # engine (Chrome: Settings -> Search engines -> Add from the page).
    location = /opensearch.xml {
        default_type application/opensearchdescription+xml;
        return 200 '<?xml version="1.0" encoding="UTF-8"?>
<OpenSearchDescription xmlns="http://a9.com/-/spec/opensearch/1.1/">
  <ShortName>Stitch &amp; Style</ShortName>
  <Description>Open the Stitch &amp; Style shop</Description>
  <Url type="text/html" method="get" template="http://localhost/go?q={searchTerms}"/>
</OpenSearchDescription>';
    }

    # Address-bar redirector. Set this as the browser's default search engine
    # (URL template: http://localhost/go?q=%s). Brand phrases open the shop;
    # every other query is forwarded to Google.
    location = /go {
        access_log off;

        # Matches "stitch and style", "stitch&style", "stitchandstyle",
        # "stitchstyle" — Chrome URL-encodes spaces/& as %20/%26/+, all allowed.
        if ($arg_q ~* "^(stitch|stich)[a-z0-9 %&+#._-]*style$") {
            return 302 http://localhost/;
        }
        return 302 https://www.google.com/search?q=$arg_q;
    }

    location / {
        proxy_pass http://angular-app:4200;

        # WebSocket upgrade. These must live in the location: defining any
        # proxy_set_header here stops inheritance of server-level ones.
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
        proxy_buffering off;

        # Keep the browser's hostname so redirects, logs and HMR agree with the
        # URL in the address bar. The Angular dev server allow-lists all hosts.
        # (No X-Forwarded-* here: the Angular proxy adds them itself, and the
        # dev server warns when it receives them without trustProxyHeaders.)
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
