# Alternative to the UFW rule: run only Nginx with host networking and point it
# at the `ng serve` process already running on the host (127.0.0.1:4200).
# Start with:
#   docker compose down
#   docker compose -f docker-compose.host.yml up -d
#
# The host dev server talks to the Spring backend on localhost:38133 itself, so
# images and API data work without opening any firewall port.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;

    server_name stitchandstyle.com
                www.stitchandstyle.com
                stichandstyle.com
                stich-style.com
                stichstyle.com
                www.stichstyle.com
                stitchstyle.com
                www.stitchstyle.com
                stitchandstyle.local
                stitch-and-style.local
                stitchstyle.local
                localhost;

    client_max_body_size 25m;

    # OpenSearch descriptor so Firefox/Chrome can add the shop as a search
    # engine (Chrome: Settings -> Search engines -> Add from the page).
    location = /opensearch.xml {
        default_type application/opensearchdescription+xml;
        return 200 '<?xml version="1.0" encoding="UTF-8"?>
<OpenSearchDescription xmlns="http://a9.com/-/spec/opensearch/1.1/">
  <ShortName>Stitch &amp; Style</ShortName>
  <Description>Open the Stitch &amp; Style shop</Description>
  <Url type="text/html" method="get" template="http://localhost/go?q={searchTerms}"/>
</OpenSearchDescription>';
    }

    # Address-bar redirector. Set this as the browser's default search engine
    # (URL template: http://localhost/go?q=%s). Brand phrases open the shop;
    # every other query is forwarded to Google.
    location = /go {
        access_log off;

        # Matches "stitch and style", "stitch&style", "stitchandstyle",
        # "stitchstyle" — Chrome URL-encodes spaces/& as %20/%26/+, all allowed.
        if ($arg_q ~* "^(stitch|stich)[a-z0-9 %&+#._-]*style$") {
            return 302 http://localhost/;
        }
        return 302 https://www.google.com/search?q=$arg_q;
    }

    location / {
        # The host's own Angular dev server (npm start), not a container.
        proxy_pass http://127.0.0.1:4200;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
        proxy_buffering off;

        proxy_set_header Host localhost:4200;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
