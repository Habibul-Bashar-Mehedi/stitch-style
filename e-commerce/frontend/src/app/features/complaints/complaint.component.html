<section class="page-container py-10">
  <div class="mx-auto max-w-2xl">
    <p class="text-sm font-semibold uppercase tracking-widest text-primary">{{ 'complaint.care' | t }}</p>
    <h1 class="mt-1 text-4xl font-black tracking-tight">{{ 'complaint.title' | t }}</h1>
    <p class="mt-2 text-sm opacity-70">{{ 'complaint.subtitle' | t }}</p>

    @if (submitted()) {
      <div class="alert alert-success mt-6">{{ 'complaint.submitted' | t }}</div>
    } @else {
      <div class="mt-6 space-y-3 rounded-3xl border border-base-300 bg-base-100 p-6 shadow-sm">
        <input class="input input-bordered w-full" [(ngModel)]="name" [placeholder]="'complaint.name' | t" />
        <input class="input input-bordered w-full" [(ngModel)]="phone" [placeholder]="'complaint.phone' | t" />
        <input class="input input-bordered w-full" [(ngModel)]="orderNumber" [placeholder]="'complaint.order' | t" />
        <textarea class="textarea textarea-bordered min-h-32 w-full" [(ngModel)]="message" [placeholder]="'complaint.message' | t"></textarea>
        @if (error()) { <div class="alert alert-error py-2 text-sm">{{ error() }}</div> }
        <button class="btn btn-primary w-full" (click)="submit()">{{ 'complaint.submit' | t }}</button>
      </div>
    }
  </div>
</section>
